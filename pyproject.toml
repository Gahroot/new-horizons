[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "new-horizons"
version = "0.1.0"
description = "Topic-agnostic active discovery engine: deconstruct, hypothesize, execute, evaluate, remember."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
horizons = "horizons.cli:main"

[tool.setuptools]
packages = ["horizons", "horizons.kb", "horizons.tools", "horizons.agents"]

[tool.setuptools.package-data]
horizons = ["prompts/*.md"]
